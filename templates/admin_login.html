<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول لوحة التحكم</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f7f7f8; color: #333; font-size: 14px;
      display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
    }
    .box { background: white; border: 1px solid #e2e2e2; border-radius: 8px; padding: 28px; width: 300px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 16px 0; color: #444; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    input[type=password] {
      width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;
      border-radius: 5px; font-size: 14px; margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 9px; background: #444; color: white; border: none;
      border-radius: 5px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #222; }
    .error { color: #b3261e; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>لوحة تحكم — تسجيل دخول</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <label>كلمة المرور</label>
      <input type="password" name="password" autofocus>
      <button type="submit">دخول</button>
    </form>
  </div>
</body>
</html>
